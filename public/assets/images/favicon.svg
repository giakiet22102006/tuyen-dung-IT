<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Nền Deep Sapphire Navy công nghệ -->
    <linearGradient id="itjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#081A36"/>
      <stop offset="100%" stop-color="#0B2A4A"/>
    </linearGradient>
    
    <!-- Cánh trái V: Gradient Electric Cyan sang Blue (Dấu Terminal Prompt) -->
    <linearGradient id="vLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Cánh phải V: Gradient Hyper Blue sang Indigo (Dải thăng tiến sự nghiệp) -->
    <linearGradient id="vRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glow viền công nghệ nhẹ -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00A6FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Khung Squircle bo góc chuẩn Apple & viền phản quang chống chìm trên Dark Mode -->
  <rect width="64" height="64" rx="16" fill="url(#itjBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Monogram V & Terminal Prompt (Hình khối đặc, sắc nét ở 16px) -->
  <g filter="url(#glow)">
    <!-- Cánh trái: Góc nghiêng dấu nhắc lệnh Terminal -->
    <path d="M 15 17 L 24 17 L 33 43 L 26.5 45 Z" fill="url(#vLeftGrad)"/>
    <!-- Cánh phải: Cột nâng sự nghiệp phát sáng -->
    <path d="M 40 17 L 49 17 L 34.5 45 L 29 43 Z" fill="url(#vRightGrad)"/>
    <!-- Vết cắt vát tương tác âm bản ở đỉnh đáy (Apex Core) -->
    <circle cx="32" cy="46" r="2.5" fill="#38BDF8"/>
  </g>
</svg>
